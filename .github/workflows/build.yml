name: build-memkernel-gki

on:
  workflow_dispatch:
    inputs:
      ddk_release:
        description: 'DDK image tag suffix (release date)'
        required: false
        default: '20251104'
        type: string

jobs:
  build:
    name: build ${{ matrix.kmi }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android11-5.4
          - android12-5.4
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12

    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.kmi }}-${{ inputs.ddk_release || '20251104' }}
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Show build environment
        run: |
          echo "=== KMI:        ${{ matrix.kmi }}"
          echo "=== KERNEL_SRC: $KERNEL_SRC"
          clang --version || true

      - name: Patch Makefile module name
        run: |
          sed -i 's/memkernel\.o/liberdade.o/g'  kernel/Makefile
          sed -i 's/memkernel-y/liberdade-y/g'   kernel/Makefile
          cat kernel/Makefile

      - name: Build liberdade.ko
        run: |
          make -C "$KERNEL_SRC" \
            M="$GITHUB_WORKSPACE/kernel" \
            ARCH=arm64 \
            CONFIG_MEMKERNEL=m \
            CONFIG_LOCALVERSION="" \
            CONFIG_MODULE_SIG=n \
            CONFIG_MODULE_SIG_FORCE=n \
            CONFIG_MODULE_SIG_ALL=n \
            CONFIG_SYSTEM_TRUSTED_KEYS="" \
            CONFIG_SYSTEM_EXTRA_CERTIFICATE="" \
            -j$(nproc)
          ls -la kernel/liberdade.ko
          strings kernel/liberdade.ko | grep vermagic

      - name: Stage artifact
        run: |
          mkdir -p out
          cp kernel/liberdade.ko "out/liberdade-${{ matrix.kmi }}.ko"
          if command -v llvm-strip >/dev/null 2>&1; then
            llvm-strip -d "out/liberdade-${{ matrix.kmi }}.ko"
            echo "stripped OK"
          fi
          ls -la out/

      - name: Upload liberdade-${{ matrix.kmi }}.ko
        uses: actions/upload-artifact@v4
        with:
          name: liberdade-${{ matrix.kmi }}.ko
          path: out/liberdade-${{ matrix.kmi }}.ko
          if-no-files-found: error
          retention-days: 30
