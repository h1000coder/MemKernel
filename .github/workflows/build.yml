name: build-memkernel-gki

on:
  workflow_dispatch:
    inputs:
      ddk_release:
        description: 'DDK date (ex: 20251104). Deixe vazio para buildar todas as datas conhecidas.'
        required: false
        default: ''
        type: string

jobs:
  build:
    name: build ${{ matrix.kmi }} @ ${{ matrix.ddk_date }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
        # Datas reais disponíveis em ghcr.io/ylarod/ddk (verificadas em nov/2026).
        # Cada par kmi+date produz um .ko com vermagic diferente —
        # o device aceita o .ko cujo vermagic bate com o kernel instalado.
        ddk_date:
          - '20250825'   # v3-era
          - '20251007'   # v3
          - '20251016'   # v4
          - '20251104'   # v5
          - '20260313'   # v6
          - '20260828'   # v7
        exclude:
          # android12-5.10 não tem tag 20251016
          - kmi: android12-5.10
            ddk_date: '20251016'
          # android17-6.18 só existe na data mais recente
          - kmi: android17-6.18
            ddk_date: '20250825'
          - kmi: android17-6.18
            ddk_date: '20251007'
          - kmi: android17-6.18
            ddk_date: '20251016'
          - kmi: android17-6.18
            ddk_date: '20251104'
          - kmi: android17-6.18
            ddk_date: '20260313'

    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.kmi }}-${{ inputs.ddk_release || matrix.ddk_date }}
      options: --privileged

    # Se a imagem DDK não existir para esse par, pula sem falhar o job inteiro
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Show build environment
        run: |
          echo "=== KMI:        ${{ matrix.kmi }}"
          echo "=== DDK date:   ${{ inputs.ddk_release || matrix.ddk_date }}"
          echo "=== KERNEL_SRC: $KERNEL_SRC"
          clang --version || true

      - name: Patch Makefile module name
        run: |
          sed -i 's/memkernel\.o/liberdade.o/g'  kernel/Makefile
          sed -i 's/memkernel-y/liberdade-y/g'   kernel/Makefile
          cat kernel/Makefile

      - name: Build liberdade.ko
        run: |
          make -C "$KERNEL_SRC" \
            M="$GITHUB_WORKSPACE/kernel" \
            ARCH=arm64 \
            CONFIG_MEMKERNEL=m \
            CONFIG_KPROBES=y \
            CONFIG_LOCALVERSION="" \
            CONFIG_MODVERSIONS=n \
            CONFIG_MODULE_SIG=n \
            CONFIG_MODULE_SIG_FORCE=n \
            CONFIG_MODULE_SIG_ALL=n \
            CONFIG_SYSTEM_TRUSTED_KEYS="" \
            CONFIG_SYSTEM_EXTRA_CERTIFICATE="" \
            VERMAGIC_OVERRIDE="" \
            -j$(nproc)
          ls -la kernel/liberdade.ko
          echo "--- vermagic ---"
          strings kernel/liberdade.ko | grep vermagic

      - name: Stage artifact
        run: |
          mkdir -p out
          DATE="${{ inputs.ddk_release || matrix.ddk_date }}"
          cp kernel/liberdade.ko "out/liberdade-${{ matrix.kmi }}-${DATE}.ko"
          if command -v llvm-strip >/dev/null 2>&1; then
            llvm-strip -d "out/liberdade-${{ matrix.kmi }}-${DATE}.ko"
            echo "stripped OK"
          fi
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liberdade-${{ matrix.kmi }}-${{ inputs.ddk_release || matrix.ddk_date }}.ko
          path: out/liberdade-${{ matrix.kmi }}-${{ inputs.ddk_release || matrix.ddk_date }}.ko
          if-no-files-found: error
          retention-days: 30
